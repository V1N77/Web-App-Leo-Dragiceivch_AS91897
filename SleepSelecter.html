<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SleepSelect</title>
    <link rel="stylesheet" href="Sleepapp.css">
    <script src="Sleepapp.js" defer></script>
</head>
<body>

<!-- Top Navigation Bar --> 
<nav class="navbartop">
    <a href="javascript:history.back()">
        <img src="images/back.png" alt="Back">
        <span>Back</span>
    </a>
    <a href="Sleepapp.html">
        <img src="images/home.png" alt="Home">
        <span>Home</span>
    </a>
    <a href="Settings.html">
        <img src="images/settings.png" alt="Settings">
        <span>Settings</span>
    </a>
</nav>

<!-- Put all page content to give padding away from edges and nav bar -->
<div class="page-content">
    <div class="sleep-entry">

        <h2>Record Sleep</h2>

        <label for="SleepDate">Date:</label>
        <input type="date" id="SleepDate">

        <label for="SleepStart">Slept from:</label>
        <input type="time" id="SleepStart">

        <label for="SleepEnd">Slept until:</label>
        <input type="time" id="SleepEnd">

        <button onclick="SaveSleep()">Save Sleep</button>
    </div>
</div>

<!-- Bottom Navigation Bar -->
<nav class="navbarbottom">
    <a href="Information.html">
        <img src="images/information.png" alt="Information">
        <span>Information</span>
    </a>
    <a href="Personal.html">
        <img src="images/personal.png" alt="Personal">
        <span>Personal</span>
    </a>
    <a href="History.html">
        <img src="images/history.png" alt="History">
        <span>History</span>
    </a>
</nav>

</body>

</html>
